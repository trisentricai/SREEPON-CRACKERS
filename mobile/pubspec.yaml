name: sripon
description: SriPon customer mobile app — premium crackers & gift boxes
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  dio: ^5.4.0
  firebase_core: ^2.24.0
  firebase_auth: ^4.17.0
  google_sign_in: ^6.2.0
  flutter_iconly_plus: ^1.0.1
  google_fonts: ^6.2.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/brand/logo-padded.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/brand/logo-padded.png"
  remove_alpha_ios: true
