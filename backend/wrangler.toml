# Cloudflare Workers configuration for the SriPon API.
#
# Deploy (from the `backend` directory):
#   npm i
#   npx wrangler types          # regenerates worker type definitions
#   npm run build               # compiles src/ -> dist/
#   npx wrangler deploy
#
# Secrets are NOT stored in this file. Set them as ENCRYPTED secrets in the
# Cloudflare dashboard (Worker -> Settings -> Variables and Secrets -> type
# "Secret") or with:
#   npx wrangler secret put <NAME>
# They must be Secrets (not plaintext Variables): plaintext dashboard values are
# removed on every `wrangler deploy`. `keep_vars = true` below prevents that.
#
# Required secrets: DATABASE_URL, DIRECT_DATABASE_URL, REDIS_URL, JWT_SECRET,
#   UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN,
#   FIREBASE_PROJECT_ID, FIREBASE_CLIENT_EMAIL, FIREBASE_PRIVATE_KEY,
#   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
#   CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET,
#   PAYMENT_PROVIDER, PAYMENT_MERCHANT_ID, PAYMENT_CLIENT_ID,
#   PAYMENT_CLIENT_SECRET, PAYMENT_SALT_KEY, RAZORPAY_KEY_ID,
#   RAZORPAY_KEY_SECRET, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET

name = "sreepon-api"

# Pre-bundled by `npm run build` (scripts/build-worker.mjs). We bundle with
# esbuild ourselves (platform-neutral + workerd conditions) because Wrangler's
# own bundler stops iconv-lite's `./lib/streams` from loading, which crashes
# body-parser at boot. Node builtins stay external (nodejs_compat) and the
# Prisma query engine wasm is emitted next to the bundle for Wrangler to pick up.
main = "dist/worker.bundle.mjs"

# >= 2026-08-04 enables nodejs_compat (+ nodejs_compat_v2) by default, which
# the Express-on-Workers HTTP bridge (httpServerHandler) requires.
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]

# Keep the throwaway *.workers.dev URL active for quick testing.
workers_dev = true

# This Worker is deployed by Workers Builds on every push to the production
# branch. By default `wrangler deploy` deletes any variables/secrets on the
# Worker that are not declared in this file — which silently wipes values set
# in the Cloudflare dashboard (see cloudflare/workers-sdk#8871). Keep them.
keep_vars = true

[vars]
# Public runtime configuration (non-secret). Secrets go through `secret put`.
NODE_ENV = "production"
DEPLOY_TARGET = "workers"
# Browser origins allowed to call the API (comma-separated). Add every deployed
# frontend origin here (web/admin); preview URLs need their own entries.
CORS_ORIGINS = "https://sreepon-crackers.pages.dev,https://sreepon-admin.netlify.app,https://sreepon-admin.pages.dev"

# Cloudflare KV namespace used as the Redis replacement on Workers (Workers
# cannot open TCP connections to Redis). Bound as `KV`; see src/infrastructure.
[[kv_namespaces]]
binding = "KV"
id = "87bf7e00883b4b109ad58d6203ed4793"