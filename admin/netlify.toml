[build]
  base = "admin"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public client config (Supabase URL + keys, API base URL) that ships in the
  # browser bundle on purpose. Excluded from secrets scanning to avoid
  # false-positive build failures.
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_BASE_URL,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_SERVICE_ROLE_KEY"